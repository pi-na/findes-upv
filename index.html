<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Findes UPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  /* Concepto: tablero de andén. La semana arranca el martes para que el finde (vie→lun) quede en un solo bloque de 4 columnas; el rango elegido se lee como un billete perforado. Tokens con nombre: --tinta, --papel, --anden, --senal, --aviso, --via-libre */
  --papel:#eceff3;
  --superficie:#ffffff;
  --superficie-2:#f5f7f9;
  --tinta:#111a2c;
  --tinta-2:#4a5466;
  --tinta-3:#768096;
  --linea:#d2d8e1;
  --anden:#111a2c;
  --sobre-anden:#eef2f7;
  --sobre-anden-2:#a9b4c6;
  --senal:#c22f1b;
  --senal-bg:#fbe6e1;
  --aviso:#9a6200;
  --aviso-bg:#fbefd6;
  --via-libre:#1f7346;
  --via-libre-bg:#dff1e6;
  --finde-bg:#f1f4f9;
  --festivo-raya:#e9dfc6;
  --festivo-tx:#7a5a12;
  --actos-bg:#ebe6f8;
  --finales-bg:#e1edf3;
  --rango:#111a2c;
  --sobre-rango:#ffffff;
  --rango-bg:#dfe6f2;
  --foco:#1d5ee0;
  --m-ssr:#0d7482;
  --m-aiv:#b02d68;
  --m-avd:#6447c0;
  --m-iei:#c0510a;
  --m-tia:#1f5fc4;
  --m-d3d:#5f7310;
  --radio:5px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0b1019;
    --superficie:#141b28;
    --superficie-2:#19212f;
    --tinta:#e7ebf2;
    --tinta-2:#a6b0c1;
    --tinta-3:#7d889b;
    --linea:#2a3446;
    --anden:#05080e;
    --sobre-anden:#e7ebf2;
    --sobre-anden-2:#8f9bb0;
    --senal:#ff6b56;
    --senal-bg:#3b1610;
    --aviso:#f0b545;
    --aviso-bg:#33250a;
    --via-libre:#5fd395;
    --via-libre-bg:#10301e;
    --finde-bg:#172031;
    --festivo-raya:#3a3322;
    --festivo-tx:#e2c27a;
    --actos-bg:#221d38;
    --finales-bg:#132739;
    --rango:#dce5f6;
    --sobre-rango:#0b1019;
    --rango-bg:#203152;
    --foco:#82abff;
    --m-ssr:#4cc8d6;
    --m-aiv:#f27fb2;
    --m-avd:#ab96ff;
    --m-iei:#ff9b55;
    --m-tia:#7eabff;
    --m-d3d:#bcd04f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#0b1019;
  --superficie:#141b28;
  --superficie-2:#19212f;
  --tinta:#e7ebf2;
  --tinta-2:#a6b0c1;
  --tinta-3:#7d889b;
  --linea:#2a3446;
  --anden:#05080e;
  --sobre-anden:#e7ebf2;
  --sobre-anden-2:#8f9bb0;
  --senal:#ff6b56;
  --senal-bg:#3b1610;
  --aviso:#f0b545;
  --aviso-bg:#33250a;
  --via-libre:#5fd395;
  --via-libre-bg:#10301e;
  --finde-bg:#172031;
  --festivo-raya:#3a3322;
  --festivo-tx:#e2c27a;
  --actos-bg:#221d38;
  --finales-bg:#132739;
  --rango:#dce5f6;
  --sobre-rango:#0b1019;
  --rango-bg:#203152;
  --foco:#82abff;
  --m-ssr:#4cc8d6;
  --m-aiv:#f27fb2;
  --m-avd:#ab96ff;
  --m-iei:#ff9b55;
  --m-tia:#7eabff;
  --m-d3d:#bcd04f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--foco);outline-offset:2px}
.num-t,.f-fechas,.cuando,.mes-titulo,.dia .n,.billete-fechas{font-variant-numeric:tabular-nums}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

.app{max-width:1220px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-block:16px 48px}

/* ---- tablero ---- */
.tablero{background:var(--anden);color:var(--sobre-anden);border-radius:var(--radio);padding:14px 18px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:end}
.tablero h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.tablero .sub{margin:4px 0 0;color:var(--sobre-anden-2);font-size:14px}
.tablero .hoy{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;font-weight:600;text-align:right;white-space:nowrap}
.tablero .hoy small{display:block;font-size:12px;font-weight:500;color:var(--sobre-anden-2);letter-spacing:.08em;text-transform:uppercase}
.faltas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;border-top:1px dashed var(--sobre-anden-2);padding-top:8px;margin-top:4px;font-size:13px;color:var(--sobre-anden-2)}
.faltas b{color:var(--sobre-anden);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:17px;font-weight:600;margin-left:4px}
.faltas .rot{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;align-self:center}

/* ---- layout ---- */
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
.cuerpo>*{min-width:0}
@media (min-width:920px){
  .cuerpo{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
  .col-lista{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
}
.panel{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:14px}
.rot-sec{margin:0 0 8px;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}

/* ---- findes ---- */
.findes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.finde{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;padding:7px 9px 7px 12px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie-2);position:relative;transition:border-color .15s,background .15s}
.finde::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--via-libre)}
.finde.est-bloquea::before{background:var(--senal)}
.finde.est-faltas::before{background:var(--aviso)}
.finde:hover{border-color:var(--tinta-3)}
.finde:focus-visible{outline:2.5px solid var(--foco);outline-offset:2px}
.finde[aria-pressed="true"]{border-color:var(--rango);background:var(--rango-bg)}
.f-fechas{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-est{font-size:12.5px;color:var(--tinta-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-bloquea .f-est{color:var(--senal)}
.est-faltas .f-est{color:var(--aviso)}
.est-libre .f-est{color:var(--via-libre)}
.mas{margin-top:8px;background:none;border:0;padding:4px 0;color:var(--tinta-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}

/* ---- calendario ---- */
.mesbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mes-titulo{margin:0;flex:1;min-width:0;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:26px;font-weight:600;text-transform:capitalize;letter-spacing:.02em}
.btn{border:1px solid var(--linea);background:var(--superficie-2);border-radius:var(--radio);min-height:36px;min-width:36px;padding:0 10px;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--tinta-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn-flecha{font-size:20px;line-height:1;padding:0}
.cab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:3px}
.cab span{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);text-align:center;padding:2px 0}
.cab .brk{grid-column:4/8;border-bottom:2px solid var(--tinta);color:var(--tinta);padding:0 0 2px}
.cab .vac{grid-column:1/4}
.cab .fd{color:var(--tinta)}
.grilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.vacio{min-height:64px}
.dia{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;min-height:66px;padding:5px 5px 6px;border-radius:var(--radio);background:var(--superficie);border:1px solid var(--linea);display:flex;flex-direction:column;align-items:flex-start;gap:4px;position:relative;transition:background .12s,border-color .12s}
.dia.finde-col{background:var(--finde-bg)}
.dia.p-actos{background:var(--actos-bg)}
.dia.p-finales{background:var(--finales-bg)}
.dia.festivo{background:repeating-linear-gradient(135deg,var(--festivo-raya) 0 4px,transparent 4px 9px),var(--superficie)}
.dia:hover{border-color:var(--tinta-3)}
.dia:focus-visible{outline:2.5px solid var(--foco);outline-offset:1px;z-index:2}
.dia.fuera{opacity:.5}
.dia.bloquea{box-shadow:inset 0 3px 0 var(--senal)}
.dia .n{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1;display:flex;align-items:center;gap:3px;max-width:100%}
.dia.hoy .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.dia.hoy::after{content:"hoy";position:absolute;right:4px;top:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2)}
.dia .tg{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--festivo-tx);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia .tg.fin{color:var(--senal)}
.dia.en-rango{background:var(--rango-bg);border-color:var(--rango-bg)}
.dia.ext{border:2px solid var(--rango);background:var(--rango-bg)}
.dia.ext .n{background:var(--rango);color:var(--sobre-rango);padding:2px 4px;border-radius:3px;margin:-2px 0 0 -2px}
.dia.ext.hoy::after{content:""}
.marcas{display:flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.mk{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--m);border:2px solid var(--m);flex:none}
.mk.libre{background:transparent}
.mk-cl{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--m);flex:none}
@media (max-width:520px){
  .dia{min-height:56px;padding:4px 3px 5px;gap:3px}
  .vacio{min-height:56px}
  .dia .n{font-size:16px}
  .mk{width:8px;height:8px;border-width:2px}
  .mk-cl{width:5px;height:5px}
  .dia .tg{font-size:9px}
  .dia.hoy::after{font-size:8.5px;right:2px;top:2px}
  .grilla,.cab{gap:2px}
}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--tinta-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.lg-sw{display:inline-block;width:16px;height:12px;border-radius:2px;border:1px solid var(--linea)}
.lg-fest{background:repeating-linear-gradient(135deg,var(--festivo-raya) 0 3px,var(--superficie) 3px 6px)}
.lg-actos{background:var(--actos-bg)}
.lg-finales{background:var(--finales-bg)}
.lg-bar{background:var(--superficie);box-shadow:inset 0 3px 0 var(--senal)}
.lg-neutro{--m:var(--tinta-2)}

.controles{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--linea)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--tinta);margin:0}
.filtros{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid var(--linea);border-radius:999px;background:var(--superficie-2);cursor:pointer;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em}
.fchip i{width:10px;height:10px;border-radius:2px;background:var(--m)}
.fchip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.fchip[aria-pressed="false"] i{background:transparent;border:2px solid var(--m)}

/* ---- lista ---- */
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.selbar p{margin:0;flex:1;min-width:0;font-size:13.5px;color:var(--tinta-2)}
.billete{position:relative;background:var(--superficie-2);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px 12px 22px;margin-bottom:14px}
.billete::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:0;border-left:2px dashed var(--linea)}
.billete-fechas{margin:0;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.billete-fechas .flecha{color:var(--tinta-3);padding:0 4px}
.billete .dur{font-size:13px;color:var(--tinta-2)}
.resumen{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:14px}
.resumen li{display:flex;gap:8px;align-items:baseline}
.resumen li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--tinta-3);transform:translateY(-1px)}
.resumen li.r-bloquea::before{background:var(--senal)}
.resumen li.r-faltas::before{background:var(--aviso)}
.resumen li.r-libre::before{background:var(--via-libre)}
.resumen li.r-pasa{color:var(--senal);font-weight:600}
.dia-cab{margin:0 0 4px;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.kicker{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--superficie-2);border:1px solid var(--linea);color:var(--tinta-2)}
.pill.festivo{background:repeating-linear-gradient(135deg,var(--festivo-raya) 0 3px,var(--superficie) 3px 7px);color:var(--festivo-tx)}
.pill.actos{background:var(--actos-bg)}
.pill.finales{background:var(--finales-bg)}
.pill.hito{color:var(--senal);border-color:var(--senal)}
.bloque{margin-top:14px}
.bloque h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.bloque h3 .cnt{font-variant-numeric:tabular-nums;color:var(--tinta-3)}
.bloque.b-oblig h3{color:var(--senal)}
.bloque.b-libre h3{color:var(--tinta-2)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 10px;background:var(--superficie);border:1px solid var(--linea);border-left:4px solid var(--m);border-radius:var(--radio)}
.item>*{min-width:0}
.cuando{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--tinta-2)}
.cuando .fe{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--tinta)}
.cuando .ho{font-weight:500;color:var(--tinta)}
.cuando .ho.sc{color:var(--aviso);font-weight:600;font-style:italic}
.cuando .hx{font-size:11.5px;color:var(--tinta-3)}
.it-top{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em}
.chip i{width:10px;height:10px;border-radius:2px;background:var(--m)}
.tipo{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:3px;border:1px solid var(--linea);color:var(--tinta-2)}
.tipo.t-examen,.tipo.t-defensa{border-color:var(--senal);color:var(--senal)}
.tipo.t-clase{border-color:var(--aviso);color:var(--aviso)}
.asis{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:3px}
.asis.si{background:var(--senal-bg);color:var(--senal)}
.asis.no{background:var(--superficie-2);color:var(--tinta-2)}
.it-tit{margin:4px 0 0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.it-nota{margin:3px 0 0;font-size:13px;color:var(--tinta-2);overflow-wrap:anywhere}
.it-nota.falt{color:var(--aviso);font-weight:500}
.vacio-txt{margin:8px 0 0;color:var(--tinta-2);font-style:italic}
.pista{margin:12px 0 0;font-size:13px;color:var(--tinta-3)}
.aviso-filtro{margin:10px 0 0;font-size:13px;color:var(--aviso);font-weight:600}
@media (max-width:420px){
  .item{grid-template-columns:76px minmax(0,1fr);gap:8px;padding:8px}
  .cuando .fe{font-size:15px}
}
.pie{margin-top:18px;font-size:12px;color:var(--tinta-3)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
</style>


</head>
<body>
<div class="app">
  <header class="tablero">
    <div>
      <h1>Findes UPV</h1>
      <p class="sub">Semestre A 2026/27 · ETSINF · tu finde va de viernes a lunes</p>
    </div>
    <div class="hoy" id="hoy"></div>
    <div class="faltas" id="faltas"></div>
  </header>

  <div class="cuerpo">
    <div class="col-cal">
      <section class="panel" aria-labelledby="t-findes">
        <h2 class="rot-sec" id="t-findes">Findes que vienen · tocá uno para armar el rango</h2>
        <div class="findes" id="findes"></div>
        <button type="button" class="mas" id="mas-findes" hidden></button>
      </section>

      <section class="panel" style="margin-top:14px" aria-labelledby="mes-titulo">
        <div class="mesbar">
          <button type="button" class="btn btn-flecha" id="prev" aria-label="Mes anterior">‹</button>
          <h2 class="mes-titulo" id="mes-titulo" aria-live="polite"></h2>
          <button type="button" class="btn" id="ir-hoy">Hoy</button>
          <button type="button" class="btn btn-flecha" id="next" aria-label="Mes siguiente">›</button>
        </div>
        <div class="cab" aria-hidden="true">
          <span class="vac"></span><span class="brk">finde</span>
          <span>mar</span><span>mié</span><span>jue</span><span class="fd">vie</span><span class="fd">sáb</span><span class="fd">dom</span><span class="fd">lun</span>
        </div>
        <div class="grilla" id="grilla"></div>
        <div class="leyenda" aria-label="Referencias">
          <span><i class="mk lg-neutro"></i>examen o defensa (obligatorio)</span>
          <span><i class="mk libre lg-neutro"></i>entrega u otro</span>
          <span><i class="mk-cl lg-neutro"></i>clase obligatoria</span>
          <span><i class="lg-sw lg-bar"></i>día con algo obligatorio</span>
          <span><i class="lg-sw lg-fest"></i>festivo</span>
          <span><i class="lg-sw lg-actos"></i>semana de actos</span>
          <span><i class="lg-sw lg-finales"></i>finales</span>
        </div>
        <div class="controles">
          <label class="chk"><input type="checkbox" id="ver-clases" checked> Mostrar clases</label>
          <div class="filtros" id="filtros" role="group" aria-label="Filtrar por materia"></div>
        </div>

    const libre = ev.filter((e) => !e.oblig).sort(porHora);
    const actos = ev.filter((e) => e.oblig);
    const dias = dif(a, b) + 1;

    const res = [];
    if (actos.length) res.push(`<li class="r-bloquea">${plural(actos.length, 'acto obligatorio', 'actos obligatorios')}: ${esc(actos.map((e) => `${e.mat} ${e.tipo === 'defensa presencial' ? 'defensa' : e.tipo} (${fmtC(e.fecha)})`).join(', '))}</li>`);
    else res.push('<li class="r-libre">Sin exámenes ni defensas</li>');
    const g = new Map(); let desc = 0;
    cls.forEach((c) => { if (c.descontada) { desc++; return; } const k = `${c.mat}-${c.kind}`; g.set(k, (g.get(k) || 0) + 1); });
    if (g.size) {
      [...g.entries()].forEach(([k, n]) => {
        const f = D.faltas[k]; const [m, t] = k.split('-'); const q = f.quedan - n;
        res.push(`<li class="${q < 0 ? 'r-pasa' : 'r-faltas'}">Perdés ${m} ${nomKind(t)} ×${n}: te quedan ${f.quedan} → quedarían ${q}${q < 0 ? ' (te pasás del tope)' : ''}</li>`);
      });
    } else if (!desc) res.push('<li class="r-libre">No perdés clases con asistencia obligatoria</li>');
    if (desc) res.push(`<li>${plural(desc, 'clase', 'clases')} del rango ya ${desc === 1 ? 'está descontada' : 'están descontadas'} de las faltas</li>`);
    if (libre.length) res.push(`<li>${plural(libre.length, 'cosa no obligatoria', 'cosas no obligatorias')} (entregas y otros)</li>`);

    let h = `<div class="billete"><p class="kicker">Rango elegido</p><p class="billete-fechas">${esc(fmtC(a))}<span class="flecha">→</span>${esc(fmtC(b))}</p>` +
      `<span class="dur">${plural(dias, 'día', 'días')}</span>${pillsHTML([...marcas.values()])}<ul class="resumen">${res.join('')}</ul>${avisoFiltro()}</div>`;
    h += `<div class="bloque b-oblig"><h3>Asistencia obligatoria <span class="cnt">${oblig.length}</span></h3>` +
      (oblig.length ? `<ul class="items">${oblig.map(itemHTML).join('')}</ul>` : '<p class="vacio-txt">Nada obligatorio en este rango.</p>') + '</div>';
    h += `<div class="bloque b-libre"><h3>No obligatoria <span class="cnt">${libre.length}</span></h3>` +
      (libre.length ? `<ul class="items">${libre.map(itemHTML).join('')}</ul>` : '<p class="vacio-txt">Nada.</p>') + '</div>';
    h += '<p class="pista">En el rango se ven siempre las clases obligatorias, aunque "Mostrar clases" esté apagado.</p>';
    return h;
  }

  function renderLista() {
    let h, est;
    if (sel.ini && sel.fin) {
      h = renderRango(sel.ini, sel.fin);
      est = 'Tocá cualquier día para empezar otro rango.';
    } else if (sel.ini) {
      h = renderDia(sel.ini, false);
      est = `Inicio: ${fmtC(sel.ini)}. Tocá otro día para cerrar el rango.`;
    } else {
      const k = enRango(HOY) ? HOY : '2026-10-01';
      h = renderDia(k, k === HOY);
      est = 'Tocá un día para ver qué hay; tocá otro para armar un rango.';
    }
    $('lista').innerHTML = h;
    $('sel-estado').textContent = est;
    $('limpiar').disabled = !sel.ini;
  }

  function render() { renderFindes(); renderGrilla(); renderLista(); }
  render();
})();
</script>

</body>
</html>
